name: Gerar e Publicar APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restaurar chave de assinatura fixa (debug.keystore)
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Definir versão (Semantic Versioning)
        id: semver
        run: |
          GRADLE_VERSION=$(grep -oE 'versionName = .*' app/build.gradle.kts | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' || echo "0.1.0")
          COMMIT_COUNT=$(git rev-list --count HEAD)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="$GRADLE_VERSION"
          else
            TAG_VER="${LATEST_TAG#v}"
            # Usa a maior versão entre a tag atual e o build.gradle.kts
            HIGHER=$(printf '%s\n%s\n' "$TAG_VER" "$GRADLE_VERSION" | sort -V | tail -n1)
            if [ "$HIGHER" != "$TAG_VER" ]; then
              VERSION="$GRADLE_VERSION"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VER"
              COMMIT_MSG=$(git log -1 --pretty=%B)
              if echo "$COMMIT_MSG" | grep -qE '(^BREAKING CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:)'; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMIT_MSG" | grep -qE '^feat(\([^)]+\))?:'; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$COMMIT_COUNT" >> "$GITHUB_OUTPUT"
          echo "Versão definida: v$VERSION (versionCode=$COMMIT_COUNT)"

      - name: Compilar APK (assembleDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionName="${{ steps.semver.outputs.version_name }}" \
            -PversionCode="${{ steps.semver.outputs.version_code }}"
          cp app/build/outputs/apk/debug/app-debug.apk treino.apk

      - name: Salvar APK nos Artifacts da Action
        uses: actions/upload-artifact@v7
        with:
          name: treino-apk
          path: treino.apk
          if-no-files-found: error

      - name: Publicar APK na aba Releases do GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.semver.outputs.version_name }}
          VERSION_CODE: ${{ steps.semver.outputs.version_code }}
        run: |
          TAG="v${VERSION_NAME}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          printf -v NOTES '### Versão %s (`%s` · build %s)\n\n- **Última alteração:** %s\n- **Download direto:** Baixe o arquivo `treino.apk` abaixo nos *Assets* para instalar ou atualizar no celular.' "$TAG" "$SHORT_SHA" "$VERSION_CODE" "$COMMIT_MSG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" treino.apk --clobber
            gh release edit "$TAG" \
              --title "Treino $TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" treino.apk \
              --target main \
              --title "Treino $TAG" \
              --notes "$NOTES" \
              --latest
          fi
