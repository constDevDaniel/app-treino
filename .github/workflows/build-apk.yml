name: Gerar e Publicar APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restaurar chave de assinatura fixa (debug.keystore)
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - name: Compilar APK (assembleDebug)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk treino.apk

      - name: Salvar APK nos Artifacts da Action
        uses: actions/upload-artifact@v7
        with:
          name: treino-apk
          path: treino.apk
          if-no-files-found: error

      - name: Publicar APK na aba Releases do GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          printf -v NOTES '### Atualização automática (commit `%s`)\n\n- **Última alteração:** %s\n- **Download direto:** Baixe o arquivo `treino.apk` abaixo nos *Assets* para instalar ou atualizar no celular.' "$SHORT_SHA" "$COMMIT_MSG"

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest treino.apk --clobber
            gh release edit latest \
              --title "Treino APK (Última Versão - $SHORT_SHA)" \
              --notes "$NOTES" \
              --latest
          else
            gh release create latest treino.apk \
              --target main \
              --title "Treino APK (Última Versão - $SHORT_SHA)" \
              --notes "$NOTES" \
              --latest
          fi
